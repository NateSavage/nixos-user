# Savage theme for yazi — mirrors the nvim theme-savage colorscheme

[mgr]
cwd             = { fg = "#9cdcfe" }
hovered         = { fg = "#D4D4D4", bg = "#264F78" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#dcdca9", italic = true }
find_position = { fg = "#d8a0df", bg = "reset", italic = true }

marker_copied   = { fg = "#b8d7a3", bg = "#b8d7a3" }
marker_cut      = { fg = "#ec5f67", bg = "#ec5f67" }
marker_marked   = { fg = "#dcdca9", bg = "#dcdca9" }
marker_selected = { fg = "#9cdcfe", bg = "#9cdcfe" }

tab_active   = { fg = "#D4D4D4", bg = "#1e232a" }
tab_inactive = { fg = "#808080", bg = "#171b21" }
tab_width    = 1

border_symbol = "│"
border_style  = { fg = "#606060" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#171b21", bg = "#3e3e3e" }

mode_normal = { fg = "#171b21", bg = "#9cdcfe", bold = true }
mode_select = { fg = "#171b21", bg = "#b8d7a3", bold = true }
mode_unset  = { fg = "#171b21", bg = "#d8a0df", bold = true }

progress_label  = { bold = true }
progress_normal = { fg = "#569cd6", bg = "#171b21" }
progress_error  = { fg = "#F44747", bg = "#171b21" }

permissions_t = { fg = "#b8d7a3" }
permissions_r = { fg = "#dcdca9" }
permissions_w = { fg = "#ec5f67" }
permissions_x = { fg = "#48c8af" }
permissions_s = { fg = "#606060" }

[input]
border   = { fg = "#9cdcfe" }
title    = { fg = "#D4D4D4" }
value    = { fg = "#D4D4D4" }
selected = { fg = "#171b21", bg = "#9cdcfe" }

[completion]
border   = { fg = "#9cdcfe" }
active   = { fg = "#171b21", bg = "#9cdcfe" }
inactive = { fg = "#808080" }

[tasks]
border  = { fg = "#9cdcfe" }
title   = { fg = "#D4D4D4" }
hovered = { underline = true }

[which]
mask            = { bg = "#171b21" }
cand            = { fg = "#48c8af" }
rest            = { fg = "#606060" }
desc            = { fg = "#d8a0df" }
separator       = "  "
separator_style = { fg = "#606060" }

[notify]
title_info  = { fg = "#b8d7a3" }
title_warn  = { fg = "#ff8800" }
title_error = { fg = "#F44747" }

[filetype]
rules = [
  { mime = "image/*", fg = "#48c8af" },
  { mime = "video/*", fg = "#d8a0df" },
  { mime = "audio/*", fg = "#d8a0df" },
  { mime = "application/zip",             fg = "#dcdca9" },
  { mime = "application/gzip",            fg = "#dcdca9" },
  { mime = "application/x-tar",           fg = "#dcdca9" },
  { mime = "application/x-bzip",          fg = "#dcdca9" },
  { mime = "application/x-bzip2",         fg = "#dcdca9" },
  { mime = "application/x-7z-compressed", fg = "#dcdca9" },
  { mime = "application/x-rar",           fg = "#dcdca9" },
  { url = "*",  fg = "#D4D4D4" },
  { url = "*/", fg = "#569cd6" },
]
